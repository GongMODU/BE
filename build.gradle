plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gong'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	testImplementation 'io.projectreactor:reactor-test'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Spring Security
	 implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'


	// OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// JWT (jjwt)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// WebFlux (WebClient)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	//runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.115.Final:osx-aarch64'

	// Netty 가 JDK SSL stack 대신 BoringSSL(OpenSSL 계열) 사용하도록 native lib 제공
	// DART(opendart.fss.or.kr) 같은 한국 정부 API 가 Java 17 기본 cipher/namedGroups 를
	// 거부해서 SSLHandshakeException(handshake_failure) 가 발생하는 문제 해결.
	// Netty 가 classpath 에서 자동 감지해 SSL provider 로 BoringSSL 우선 사용.
	runtimeOnly 'io.netty:netty-tcnative-boringssl-static:2.0.66.Final'

	// Email
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Swagger (SpringDoc OpenAPI)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

	// python
	implementation 'org.python:jython-slim:2.7.4rc1'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Spring Boot 3.x는 기본적으로 plain jar(-plain.jar)와 bootJar 둘 다 생성하는데,
// Dockerfile의 COPY build/libs/*.jar 가 두 jar를 모두 매치해서 비결정적으로 잘못된 jar가 복사될 수 있음.
// plain jar는 실행 불가하므로 비활성화해 혼동 차단.
tasks.named('jar') {
	enabled = false
}
