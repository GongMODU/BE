name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: EC2에 SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # set -ex: 어느 단계든 실패하면 즉시 중단 + 각 단계 출력 로그화
          # git fetch + reset --hard: EC2 로컬에 어떤 변경이 남아 있어도 강제로 origin/main과 동일하게 동기화
          #   (이전에 divergent 상태로 git pull이 silent 실패하던 사고 방지)
          script: |
            set -ex
            cd /home/ubuntu/app
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            ./gradlew clean build -x test
            ls -l build/libs/
            docker compose down
            docker compose up -d --build
            docker image prune -f