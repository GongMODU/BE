services:
  # Postgres
  postgres:
    image: postgres:16
    container_name: gong-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

    # 컨테이너 내부 환경변수
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

  # Redis
  redis:
    image: redis:7
    container_name: gong-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

  # Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gong-app
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      ANTHROPIC_API_URL: ${ANTHROPIC_API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_YOUTUBE_KEY: ${ADMIN_YOUTUBE_KEY}
      ADMIN_IPO_KEY: ${ADMIN_IPO_KEY}
      YOUTUBE_PROD_REPLACE_URL: ${YOUTUBE_PROD_REPLACE_URL}
      DART_API_KEY: ${DART_API_KEY}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      # JVM heap + DART API 호출 행 걸림 회피용 JVM 옵션
      # - TLSv1.2 강제 (DART 가 TLSv1.3 거부)
      # - namedGroups 제한 (Java 17 신규 EC curves 제외)
      # - preferIPv4Stack: Java 의 IPv6 우선 동작이 docker bridge 에서 행 거는 케이스 회피
      # - reactor.netty.native=false: native epoll 대신 NIO 사용. 일부 EC2/커널 조합에서
      #   epoll selector 가 SSL handshake 시작 단계에서 멈추는 알려진 이슈 회피
      # - disabledAlgorithms 변경은 공백 포함 → ModuApplication.main() 의
      #   Security.setProperty() 에서 설정
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -Djdk.tls.client.protocols=TLSv1.2 -Djdk.tls.namedGroups=secp256r1,secp384r1,secp521r1 -Djava.net.preferIPv4Stack=true -Dreactor.netty.native=false"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend-network

networks:
  backend-network:

volumes:
  postgres_data:
  redis_data: