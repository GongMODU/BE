services:
  # Postgres
  postgres:
    image: postgres:16
    container_name: gong-postgres
    restart: unless-stopped

    # 컨테이너 내부 환경변수
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

  # Redis
  redis:
    image: redis:7
    container_name: gong-redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

  # Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gong-app
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      ANTHROPIC_API_URL: ${ANTHROPIC_API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_YOUTUBE_KEY: ${ADMIN_YOUTUBE_KEY}
      ADMIN_IPO_KEY: ${ADMIN_IPO_KEY}
      YOUTUBE_PROD_REPLACE_URL: ${YOUTUBE_PROD_REPLACE_URL}
      DART_API_KEY: ${DART_API_KEY}
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      # JVM heap 상한 + DART API (opendart.fss.or.kr) SSL handshake_failure 회피
      # 진단 결과: DART 는 TLS_RSA_WITH_AES_128_GCM_SHA256 (RSA-only cipher) 만 받는데
      # Java 17 이 보안상 RSA-only cipher 를 기본 disabledAlgorithms 에 포함시켜
      # 협상 단계에서 제외 → 매치 cipher 없음 → handshake_failure 발생.
      # 해결: disabledAlgorithms 에서 RSA 관련 제거. TLSv1/v1.1 같은 진짜 위험한 것만 유지.
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -Djdk.tls.client.protocols=TLSv1.2 -Djdk.tls.namedGroups=secp256r1,secp384r1,secp521r1 -Djdk.tls.disabledAlgorithms=SSLv3,TLSv1,TLSv1.1,RC4,DES,MD5withRSA,DH keySize < 1024,EC keySize < 224,3DES_EDE_CBC,anon,NULL"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - backend-network

networks:
  backend-network:

volumes:
  postgres_data:
  redis_data: